name: Keep Supabase alive

# Free Supabase projects pause after 7 days of inactivity. This runs a tiny
# read query against the database every day so it always counts as active.
# Reliable and independent of Vercel's best-effort crons.

on:
  schedule:
    - cron: "17 8 * * *"   # daily at ~08:17 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://hsqxamnbdqdquhvqwahg.supabase.co/rest/v1/users?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "Keep-alive query failed"; exit 1
          fi
